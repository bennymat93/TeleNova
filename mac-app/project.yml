# XcodeGen: `xcodegen generate` (run by build.sh) writes BNStream.xcodeproj. TN_VERSION / TN_BUILD come from build.sh.
name: BNStream
options:
  bundleIdPrefix: io.github.bennymat93
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: ${TN_VERSION}
    CURRENT_PROJECT_VERSION: ${TN_BUILD}
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
targets:
  BNStream:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources
      - path: ../ios-app/Sources/HelperRelay.swift
      - path: ../ios-app/Sources/LocalServer.swift
      - path: Resources/bridge.js
        buildPhase: resources
      - path: build/Assets.xcassets
      - path: build/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bennymat93.bnstream.mac
        PRODUCT_NAME: BN Stream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    info:
      path: build/Info.plist
      properties:
        CFBundleName: BN Stream
        CFBundleDisplayName: BN Stream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: BN Stream
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.bennymat93.bnstream.mac
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [telenova, bnstream]
