# TeleNova web: refresh the Israeli TV guide (web/data/epg_il.json) every 6 hours.
# epgshare01 sends no CORS headers, so the browser cannot read it; this job turns it into a small JSON next to the app.
# No secrets are used: only the repository's own GITHUB_TOKEN to commit the file.
name: epg
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epg
  cancel-in-progress: false
jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the script is Python 3.8 compatible
      - name: Build web/data/epg_il.json
        run: python src/qa/web/gen_epg.py
      - name: Commit when changed
        run: |
          git config user.name "telenova-epg"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/epg_il.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "EPG: web/data/epg_il.json refreshed"
          git pull --rebase --autostash
          git push
